# Copy into each APP repo as .github/workflows/deploy.yml
# Push to main -> deploy to dev. Manual run -> choose dev or test (test needs approval).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [dev, test]
        default: test

env:
  IMAGE_NAME: gateway # change per app: gateway | web

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        run: |
          IMG=${{ vars.ACR_LOGIN_SERVER }}/${IMAGE_NAME}:${{ github.sha }}
          docker build -t "$IMG" .
          docker push "$IMG"

      - uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_NAME }} # from `tofu output`
          images: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
